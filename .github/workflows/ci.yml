name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: Production build (Serwist SW)
        env:
          # Build without DB migrate; generate client already ran
          DATABASE_URL: postgresql://user:pass@localhost:5432/verk
          DIRECT_URL: postgresql://user:pass@localhost:5432/verk
          AUTH_SECRET: ci-build-secret-not-for-production
          AUTH_URL: http://localhost:3000
        run: npx next build --webpack
      - name: PWA manifest + SW artifacts
        run: |
          test -f public/manifest.webmanifest
          test -f public/sw.js
          test -f public/icons/icon-192.png
      # E2E / migrate tests need DATABASE_URL — skip when secret absent (no Docker services)
      - name: Migrate + Playwright
        if: ${{ secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: http://localhost:3000
        run: |
          npx prisma migrate deploy
          npx playwright install --with-deps chromium
          npm run test:e2e
